{% extends "tickets/base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
    <div class="auth">
        <h1>Entrar</h1>
        <p class="muted">Acesse com seu usuário para abrir ou acompanhar chamados.</p>
        <div class="card pad">
            {% if form.errors %}
                <div class="alert error">Usuário ou senha incorretos.</div>
            {% endif %}
            <form method="post" class="form">
                {% csrf_token %}
                {{ form.as_p }}
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn block">Entrar</button>
            </form>
        </div>
    </div>
{% endblock %}
