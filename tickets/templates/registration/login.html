{% extends "tickets/base.html" %}
{% block content %}
    <h1>Entrar</h1>
    {% if form.errors %}<p>Usuário ou senha incorretos.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Entrar</button>
    </form>
{% endblock %}
