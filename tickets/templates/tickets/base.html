<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Help Desk{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 860px;
               margin: 0 auto; padding: 16px; }
        nav { display: flex; gap: 12px; align-items: center;
              padding-bottom: 12px; border-bottom: 1px solid #ddd; }
        nav .spacer { flex: 1; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border-bottom: 1px solid #eee; padding: 8px; text-align: left; }
        .msg { padding: 8px 12px; margin: 8px 0; border-radius: 6px;
               background: #e8f4ff; }
        .msg.error { background: #ffe8e8; }
        .comment { border: 1px solid #ddd; border-radius: 6px;
                   padding: 8px 12px; margin: 8px 0; }
        .comment.internal { background: #fff8e1; border-color: #f0d98a; }
        .badge { padding: 2px 8px; border-radius: 10px; background: #eee;
                 font-size: 0.85em; }
        input, select, textarea { font: inherit; max-width: 100%; }
    </style>
</head>
<body>
    <nav>
        <strong>Help Desk</strong>
        {% if user.is_authenticated %}
            <a href="{% url 'tickets:list' %}">Chamados</a>
            <a href="{% url 'tickets:create' %}">Novo chamado</a>
            <span class="spacer"></span>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Sair ({{ user.get_username }})</button>
            </form>
        {% else %}
            <span class="spacer"></span>
            <a href="{% url 'login' %}">Entrar</a>
        {% endif %}
    </nav>

    {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
</body>
</html>
